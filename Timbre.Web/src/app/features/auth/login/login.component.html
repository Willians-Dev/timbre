<div class="login-page">

  <section class="login-panel">

    <!-- =========================================
         IDENTIDAD / PRESENTACIÓN
    ========================================== -->
    <div class="brand-section">

      <div class="brand-badge">
        CA
      </div>

      <h1>
        Control de Asistencia
      </h1>

      <p>
        Administración y registro de asistencia
        mediante reconocimiento facial.
      </p>

    </div>


    <!-- =========================================
         FORMULARIO DE LOGIN
    ========================================== -->
    <div class="login-card">

      <div class="login-header">

        <span class="eyebrow">
          ACCESO AL SISTEMA
        </span>

        <h2>
          Bienvenido
        </h2>

        <p>
          Ingrese sus credenciales para continuar.
        </p>

      </div>


      <form
        (ngSubmit)="ingresar()"
        #loginForm="ngForm"
        novalidate>

        <!-- =====================================
             USUARIO
        ====================================== -->
        <div class="form-group">

          <label for="usuario">
            Usuario
          </label>

          <input
            id="usuario"
            name="usuario"
            type="text"
            [(ngModel)]="nombreUsuario"
            autocomplete="username"
            placeholder="Ingrese su usuario"
            [disabled]="cargando"
            required>

        </div>


        <!-- =====================================
             CONTRASEÑA
        ====================================== -->
        <div class="form-group">

          <label for="password">
            Contraseña
          </label>

          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            autocomplete="current-password"
            placeholder="Ingrese su contraseña"
            [disabled]="cargando"
            required>

        </div>


        <!-- =====================================
             ERROR INLINE
        ====================================== -->
        @if (mensajeError) {

          <div
            class="form-error"
            role="alert">

            {{ mensajeError }}

          </div>

        }


        <!-- =====================================
             BOTÓN
        ====================================== -->
        <button
          class="btn-primary"
          type="submit"
          [disabled]="cargando">

          @if (cargando) {

            <span>
              Ingresando...
            </span>

          }
          @else {

            <span>
              Ingresar
            </span>

          }

        </button>

      </form>

    </div>

  </section>

</div>
